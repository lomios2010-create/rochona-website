        points: [

          { name: "সময়ানুবর্তিতার সংজ্ঞা", text: "নির্দিষ্ট কাজ নির্দিষ্ট সময়ে সম্পন্ন করার অভ্যাসকেই সময়ানুবর্তিতা বা সময়নিষ্ঠতা বলা হয়। অন্য কথায়, সময়ের মূল্য অনুধাবন করে অলসতা ত্যাগ করে নির্ধারিত সূচি অনুযায়ী দায়িত্ব পালন করাই হলো সময়ানুবর্তিতা। জীবনের কোনো কাজকে কালকের জন্য ফেলে না রাখার নামই সময়জ্ঞান।" },

          { name: "ছাত্রজীবনে সময়ানুবর্তিতা", text: "সময়ানুবর্তিতার অভ্যাস গড়ার উপযুক্ত সময় হলো ছাত্রজীবন। যে শিক্ষার্থী পড়ালেখা, খেলাধুলা ও বিশ্রামের জন্য সঠিক সময়সূচি মেনে চলে, পরীক্ষায় তার সফল হওয়া সুনিশ্চিত। আলসেমি করে পড়াশোনা জমিয়ে রাখলে পরীক্ষার পূর্বে চাপ সৃষ্টি হয় এবং কাঙ্ক্ষিত ফলাফল অর্জন সম্ভব হয় না।" },

          { name: "সময়ের অপচয়ের পরিণতি", text: "সময়ের অপচয় মানবজীবনের সবচেয়ে বড় অপরাধের একটি। আজ কাজ না করে ভবিষ্যতের জন্য ফেলে রাখলে কাজের পাহাড় জমে যায়। শেষ মুহূর্তে তাড়াহুড়ো করতে গিয়ে কাজের মান নষ্ট হয় এবং ব্যর্থতার গ্লানি নিয়ে জীবন কাটাতে হয়, যা জীবনে চরম হতাশা নিয়ে আসে।" },

          { name: "জাতীয় জীবনে সময়ানুবর্তিতা", text: "একটি জাতির সামগ্রিক প্রগতির পেছনে সময়ানুবর্তিতার ভূমিকা অপরিসীম। জাপানের মতো উন্নত জাতিগুলোর উন্নতির মূল রহস্য হলো তাদের নাগরিকদের চরম সময়নিষ্ঠতা। সময়মতো ট্রেন চলা থেকে শুরু করে সরকারি দপ্তর পরিচালনা—সবক্ষেত্রে সময় মেনে চলার অভ্যাসই তাদের বিশ্বমঞ্চে শীর্ষে নিয়ে গেছে।" },
          { name: "সময় ব্যবস্থাপনার কৌশল", text: "সঠিক সময় ব্যবস্থাপনার (Time Management) জন্য প্রতিদিনের কাজের অগ্রাধিকার তালিকা (To-Do List) তৈরি করা উচিত। গুরুত্বপূর্ণ কাজগুলো আগে শেষ করা এবং অনাবশ্যক কাজে সময় নষ্ট না করার মানসিকতা গড়ে তুলতে হবে।" },
          { name: "ব্যক্তিত্ব গঠনে সময়ানুবর্তিতা", text: "যে ব্যক্তি সময়নিষ্ঠ, সমাজে সে পরম শ্রদ্ধার পাত্র। সময়ানুবর্তিতা মানুষের আত্মবিশ্বাস বৃদ্ধি করে এবং মনে প্রশান্তি এনে দেয়। প্রতিশ্রুতি রক্ষা করা এবং নির্ধারিত সময়ে উপস্থিত হওয়ার অভ্যাস একজন মানুষকে মার্জিত, রুচিশীল ও নির্ভরযোগ্য ব্যক্তিত্ব হিসেবে সমাজে প্রতিষ্ঠিত করে।" },
          { name: "চরিত্র গঠনে ভূমিকা", text: "সময়ানুবর্তিতা মানুষের চরিত্রে শৃঙ্খলা, নিয়মকানুন ও দায়িত্ববোধের জন্ম দেয়। এটি মানুষকে মিথ্যাচার ও ফাঁকিবাজি থেকে দূরে রাখে। চারিত্রিক সততা ও দৃঢ়তা বজায় রাখতে সময়ানুবর্তিতার অনুশীলন এক জাদুকরী ভূমিকা পালন করে।" },
          { name: "উপসংহার", text: "সময় কারও আদেশের তোয়াক্কা করে না, সে তার নিজস্ব গতিতে ধাবমান। তাই সফল ও সুন্দর জীবন গড়ে তুলতে হলে শৈশব থেকেই সময়ানুবর্তিতার অনুশীলন উচিত। সময়ের সঠিক মূল্যায়ন করে আমরা যেন আমাদের জীবন ও জাতীয় জীবনকে সাফল্যের আলোয় আলোকিত করতে পারি—এটাই হওয়া উচিত আমাদের একমাত্র ব্রত।" }
        ]
      }
    ];

    let activeIndex = 1; // Default to index 1 (Topic 10: সময়ানুবর্তিতা)

    function renderSidebar() {
      const listContainer = document.getElementById("sidebarList");
      listContainer.innerHTML = "";
      
      rochonaData.forEach((item, index) => {
        const isActive = index === activeIndex;
        const btn = document.createElement("button");
        btn.onclick = () => selectRochona(index);
        btn.className = `w-full text-left px-3 py-2.5 rounded-lg text-sm flex justify-between items-center transition ${
          isActive 
            ? "bg-emerald-50 text-emerald-800 font-semibold border-l-4 border-emerald-600" 
            : "hover:bg-slate-50 text-slate-700"
        }`;
        
        btn.innerHTML = `
          <span class="truncate">${item.title}</span>
          <span class="text-xs bg-emerald-100 text-emerald-800 px-2 py-0.5 rounded-full font-medium ml-2">${item.points.length} পয়েন্ট</span>
        `;
        listContainer.appendChild(btn);
      });
    }

    function renderContent() {
      const container = document.getElementById("rochonaContainer");
      const current = rochonaData[activeIndex];

      if (!current) return;

      let pointsHtml = current.points.map((p, idx) => `
        <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm space-y-2">
          <div class="flex items-center gap-2">
            <span class="bg-emerald-600 text-white text-xs font-bold px-2.5 py-1 rounded-md">পয়েন্ট ${idx + 1}</span>
            <h3 class="text-lg font-bold text-slate-800">${p.name}</h3>
          </div>
          <p class="text-slate-700 leading-relaxed text-justify">${p.text}</p>
        </div>
      `).join("");

      container.innerHTML = `
        <div class="bg-white p-6 rounded-xl border border-slate-200 shadow-sm space-y-3">
          <h1 class="text-2xl font-bold text-emerald-800">${current.title}</h1>
          <div class="flex gap-4 text-xs text-slate-500 font-medium">
            <span>📌 মোট পয়েন্ট সংখ্যা: ${current.points.length} টি</span>
            <span>📖 রচনা নম্বর: ${current.id}</span>
          </div>
          ${current.quote ? `<div class="bg-emerald-50 border-l-4 border-emerald-500 p-3 rounded-r-md text-emerald-900 text-sm italic font-medium">"${current.quote}"</div>` : ''}
        </div>
        <div class="space-y-4">
          ${pointsHtml}
        </div>
      `;
    }

    function selectRochona(index) {
      activeIndex = index;
      renderSidebar();
      renderContent();
    }

    function filterList() {
      const query = document.getElementById("searchInput").value.toLowerCase();
      const buttons = document.querySelectorAll("#sidebarList button");
      buttons.forEach((btn, idx) => {
        const title = rochonaData[idx].title.toLowerCase();
        btn.style.display = title.includes(query) ? "flex" : "none";
      });
    }

    function toggleTheme() {
      document.body.classList.toggle("bg-slate-900");
      document.body.classList.toggle("text-slate-100");
    }

    function copyCurrentRochona() {
      const current = rochonaData[activeIndex];
      let fullText = `${current.title}\n\n`;
      if (current.quote) fullText += `"${current.quote}"\n\n`;
      current.points.forEach((p, idx) => {
        fullText += `পয়েন্ট ${idx + 1}: ${p.name}\n${p.text}\n\n`;
      });
      navigator.clipboard.writeText(fullText);
      alert("রচনা সফলভাবে কপি করা হয়েছে!");
    }

    // Initialize App
    renderSidebar();
    renderContent();
  </script>
</body>
</html>
