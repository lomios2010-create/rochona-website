<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>রচনা সম্ভার</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'SolaimanLipi', 'Kalpurush', 'Hind Siliguri', sans-serif;
    }

    body {
      background-color: #f3f4f6;
      color: #1f2937;
      transition: background-color 0.3s, color 0.3s;
    }

    /* Dark Mode Styles */
    body.dark-mode {
      background-color: #111827;
      color: #f3f4f6;
    }

    body.dark-mode .sidebar,
    body.dark-mode .mobile-header,
    body.dark-mode .essay-card {
      background-color: #1f2937;
      border-color: #374151;
      color: #f3f4f6;
    }

    body.dark-mode .menu-item {
      color: #d1d5db;
    }

    body.dark-mode .menu-item:hover,
    body.dark-mode .menu-item.active {
      background-color: #115e59;
      color: #ffffff;
    }

    body.dark-mode .point-card {
      background-color: #374151;
      color: #f3f4f6;
    }

    body.dark-mode .point-header h2,
    body.dark-mode .breadcrumb,
    body.dark-mode .point-card p {
      color: #f3f4f6;
    }

    body.dark-mode .action-btn {
      background-color: #374151;
      color: #f3f4f6;
      border-color: #4b5563;
    }

    body.dark-mode .search-box input {
      background-color: #374151;
      color: #ffffff;
      border-color: #4b5563;
    }

    .app-container {
      display: flex;
      min-height: 100vh;
    }

    /* Mobile Header Bar */
    .mobile-header {
      display: none;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      background-color: #ffffff;
      border-bottom: 1px solid #e5e7eb;
      position: sticky;
      top: 0;
      z-index: 40;
    }

    .hamburger-btn {
      font-size: 24px;
      background: none;
      border: none;
      cursor: pointer;
      color: #0d9488;
    }

    /* Sidebar Navigation */
    .sidebar {
      width: 300px;
      background-color: #ffffff;
      border-right: 1px solid #e5e7eb;
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      height: 100vh;
      position: sticky;
      top: 0;
      overflow-y: auto;
    }

    .sidebar-header {
      padding: 16px;
      border-bottom: 1px solid #f3f4f6;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: bold;
      font-size: 20px;
      color: #0d9488;
      margin-bottom: 12px;
    }

    .search-box input {
      width: 100%;
      padding: 8px 12px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      outline: none;
      font-size: 14px;
    }

    .sidebar-menu {
      padding: 8px 0;
    }

    .menu-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 16px;
      color: #374151;
      text-decoration: none;
      font-size: 14px;
      border-left: 3px solid transparent;
      cursor: pointer;
    }

    .menu-item:hover, .menu-item.active {
      background-color: #ccfbf1;
      color: #0f766e;
      border-left-color: #0d9488;
      font-weight: 600;
    }

    .badge {
      background-color: #0d9488;
      color: white;
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 12px;
    }

    /* Backdrop Overlay */
    .overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.4);
      z-index: 45;
    }

    /* Main Content Area */
    .main-content {
      flex-grow: 1;
      padding: 24px;
      max-width: 900px;
      margin: 0 auto;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .breadcrumb {
      font-size: 16px;
      font-weight: bold;
      color: #374151;
    }

    .actions {
      display: flex;
      gap: 8px;
    }

    .action-btn {
      background: #ffffff;
      border: 1px solid #d1d5db;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
    }

    .print-btn {
      background: #0d9488;
      color: white;
      border: none;
    }

    /* Essay Content Card */
    .essay-card {
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      padding: 28px;
    }

    .essay-title {
      font-size: 28px;
      color: #0f766e;
      margin-bottom: 12px;
    }

    .essay-meta {
      display: flex;
      gap: 16px;
      font-size: 13px;
      color: #6b7280;
      margin-bottom: 24px;
    }

    /* Quotation Styling */
    .quote-box {
      background-color: #f0fdf4;
      border-left: 4px solid #22c55e;
      padding: 12px 16px;
      border-radius: 4px;
      color: #15803d;
      font-style: italic;
    }

    .featured-quote {
      margin-bottom: 24px;
      font-size: 15px;
    }

    .section-quote {
      margin-top: 14px;
      background-color: #f0fdfa;
      border-left-color: #0d9488;
      color: #0f766e;
    }

    /* Section Cards */
    .point-card {
      background: #f9fafb;
      border-left: 4px solid #0d9488;
      border-radius: 6px;
      padding: 16px 20px;
      margin-bottom: 20px;
    }

    .point-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
    }

    .point-badge {
      background-color: #0d9488;
      color: white;
      font-size: 12px;
      padding: 3px 8px;
      border-radius: 4px;
      font-weight: bold;
    }

    .point-header h2 {
      font-size: 18px;
      color: #111827;
    }

    .point-card p {
      line-height: 1.7;
      color: #374151;
      font-size: 15px;
    }

    /* Mobile Breakpoint */
    @media (max-width: 768px) {
      .mobile-header {
        display: flex;
      }

      .sidebar {
        position: fixed;
        top: 0;
        left: 0;
        z-index: 50;
        transform: translateX(-100%);
        transition: transform 0.3s ease-in-out;
      }

      .sidebar.active {
        transform: translateX(0);
      }

      .overlay.active {
        display: block;
      }

      .main-content {
        padding: 16px;
      }

      .essay-card {
        padding: 16px;
      }

      .essay-title {
        font-size: 22px;
      }
    }
  </style>
</head>
<body>

  <!-- Mobile Top Header -->
  <header class="mobile-header">
    <button id="menu-toggle" class="hamburger-btn" aria-label="Toggle Menu">☰</button>
    <div class="logo">
      <span class="logo-icon">📚</span>
      <span class="logo-text">রচনা সম্ভার</span>
    </div>
  </header>

  <!-- Background Overlay for Mobile Drawer -->
  <div id="overlay" class="overlay"></div>

  <div class="app-container">
    <!-- Sidebar Navigation -->
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-header">
        <div class="logo">
          <span class="logo-icon">📚</span>
          <span class="logo-text">রচনা সম্ভার</span>
        </div>
        <div class="search-box">
          <input type="text" id="search-input" placeholder="রচনা বা পয়েন্ট খুঁজুন..." />
        </div>
      </div>
      <nav class="sidebar-menu" id="essay-list">
        <!-- Dynamic Menu Items -->
      </nav>
    </aside>

    <!-- Main Content Area -->
    <main class="main-content">
      <!-- Top Action Bar -->
      <div class="top-bar">
        <div class="breadcrumb" id="current-title-breadcrumb">
          ১. বাংলাদেশের পর্যটন শিল্প
        </div>
        <div class="actions">
          <button class="action-btn" id="theme-btn">🌙 থিম</button>
          <button class="action-btn" id="copy-btn">📋 কপি</button>
          <button class="action-btn print-btn" id="print-btn">🖨️ প্রিন্ট</button>
        </div>
      </div>

      <!-- Essay Card -->
      <article class="essay-card">
        <h1 class="essay-title" id="essay-title">১. বাংলাদেশের পর্যটন শিল্প</h1>
        <div class="essay-meta">
          <span class="meta-item">📌 মোট পয়েন্ট সংখ্যা: <strong id="total-points">১৫ টি</strong></span>
          <span class="meta-item">📖 রচনা নম্বর: <strong id="essay-number">১</strong></span>
        </div>

        <!-- Featured Header Quote -->
        <div class="quote-box featured-quote" id="header-quote">
          <p>"এমন দেশটি কোথাও খুঁজে পাবে নাকো তুমি, সকল রানীর দেশ সে যে- আমার জন্মভূমি" — <em>দ্বিজেন্দ্রলাল রায়</em></p>
        </div>

        <!-- Section Points Container -->
        <div class="points-container" id="points-container">
          <!-- Dynamic Content Loads Here -->
        </div>
      </article>
    </main>
  </div>

  <script>
    // Bangla Digit Converter
    function toBanglaNum(num) {
      const banglaDigits = ['০', '১', '২', '৩', '৪', '৫', '৬', '৭', '৮', '৯'];
      return num.toString().replace(/\d/g, digit => banglaDigits[digit]);
    }

    // Essay Database
    const essays = [
      {
        id: 1,
        title: 'বাংলাদেশের পর্যটন শিল্প',
        headerQuote: '"এমন দেশটি কোথাও খুঁজে পাবে নাকো তুমি, সকল রানীর দেশ সে যে- আমার জন্মভূমি" — <em>দ্বিজেন্দ্রলাল রায়</em>',
        points: [
          {
            title: 'সূচনা',
            content: 'সুজলা-সুফলা, শস্য-শ্যামলা আমাদের এই বাংলাদেশ অপার প্রাকৃতিক সৌন্দর্যের এক অনন্য লীলাভূমি। নদীমাতৃক এই দেশের কোণে কোণে ছড়িয়ে আছে রূপের অপরূপ বৈচিত্র্য, যা আবহমানকাল ধরে দেশি-বিদেশি ভ্রমণপিপাসুদের আকর্ষিত করে আসছে।',
            quote: '"রূপসী বাংলার রূপ দেখিয়াছি আমি, তাই আমি পৃথিবীর রূপ খুঁজিতে যাই না আর" — <em>জীবনানন্দ দাশ</em>'
          },
          {
            title: 'পর্যটন শিল্পের ধারণা',
            content: 'পর্যটন মূলত মানুষের নতুনকে জানার, অদেখাকে দেখার এবং মানসিক বিনোদন লাভের একটি সার্বজনীন মাধ্যম। যখন ভ্রমণকে কেন্দ্র করে হোটেল, রেস্তোরাঁ, যাতায়াত ও বিনোদন পার্ক গড়ে ওঠে, তাকে পর্যটন শিল্প বলা হয়।'
          },
          {
            title: 'পরিবেশ ও নিরাপত্তা',
            content: 'পর্যটন শিল্পের প্রসারের সাথে সাথে প্রাকৃতিক ভারসাম্য রক্ষা ও পর্যটকদের নিরাপত্তা প্রদান অপরিহার্য। পরিবেশ বান্ধব পর্যটন গড়ে তোলার মাধ্যমেই এই শিল্পের টেকসই উন্নয়ন সম্ভব।',
            quote: '"প্রকৃতিকে ভালোবাসুন, সৌন্দর্য উপভোগ করুন, পরিবেশ রক্ষা করুন!"'
          }
        ]
      },
      {
        id: 2,
        title: 'বাংলাদেশের উৎসব',
        headerQuote: '"নানা জাতির নানা মত, নানা পরিধান, বিবিধের মাঝে দেখ মিলন মহান।"'
      },
      { id: 3, title: 'জগদীশচন্দ্র বসু' },
      { id: 4, title: 'রোকেয়া সাখাওয়াত হোসেন' },
      { id: 5, title: 'লঙ্কা ভ্রমণের অভিজ্ঞতা' },
      { id: 6, title: 'একটি ঝড়ের রাত' },
      { id: 7, title: 'কৃষি উদ্যোক্তা' },
      { id: 8, title: 'ভাষা আন্দোলন' },
      { id: 9, title: 'বাংলাদেশের মুক্তিযুদ্ধ' },
      { id: 10, title: 'সময়ানুবর্তিতা' },
      { id: 11, title: 'ক্রিকেট বাংলাদেশ' },
      { id: 12, title: 'বাংলাদেশের ফুটবল' },
      { id: 13, title: 'কৃষিকাজে বিজ্ঞান' },
      { id: 14, title: 'মাদকাসক্তি ও এর প্রতিকার' }
    ];

    let activeEssayId = 1;

    // Load Essay Content
    function loadEssay(id) {
      activeEssayId = id;
      const essay = essays.find(e => e.id === id) || essays[0];
      const banglaId = toBanglaNum(essay.id);

      document.getElementById('essay-title').innerText = `${banglaId}. ${essay.title}`;
      document.getElementById('current-title-breadcrumb').innerText = `${banglaId}. ${essay.title}`;
      document.getElementById('essay-number').innerText = banglaId;
      
      const pointCount = essay.points ? essay.points.length : 15;
      document.getElementById('total-points').innerText = `${toBanglaNum(pointCount)} টি`;

      document.getElementById('header-quote').innerHTML = `<p>${essay.headerQuote || '"জ্ঞানই শক্তি"'}</p>`;

      const pointsContainer = document.getElementById('points-container');
      if (essay.points && essay.points.length > 0) {
        pointsContainer.innerHTML = essay.points.map((p, index) => `
          <section class="point-card">
            <div class="point-header">
              <span class="point-badge">পয়েন্ট ${toBanglaNum(index + 1)}</span>
              <h2>${p.title}</h2>
            </div>
            <p>${p.content}</p>
            ${p.quote ? `<div class="quote-box section-quote"><p>${p.quote}</p></div>` : ''}
          </section>
        `).join('');
      } else {
        pointsContainer.innerHTML = `
          <section class="point-card">
            <div class="point-header">
              <span class="point-badge">পয়েন্ট ১</span>
              <h2>সূচনা</h2>
            </div>
            <p>${essay.title} সম্পর্কিত বিস্তারিত মূল বিষয়বস্তু শীঘ্রই হালনাগাদ করা হবে।</p>
          </section>
        `;
      }

      renderSidebar();
    }

    // Render Sidebar Menu
    function renderSidebar(filterText = '') {
      const sidebarMenu = document.getElementById('essay-list');
      if (!sidebarMenu) return;

      const filteredEssays = essays.filter(e => e.title.includes(filterText));

      sidebarMenu.innerHTML = filteredEssays.map((essay) => {
        const banglaIndex = toBanglaNum(essay.id);
        const pointCount = essay.points ? essay.points.length : 15;
        const banglaPoints = toBanglaNum(pointCount);
        const isActive = essay.id === activeEssayId ? 'active' : '';

        return `
          <div class="menu-item ${isActive}" onclick="selectEssay(${essay.id})">
            <span>${banglaIndex}. ${essay.title}</span>
            <span class="badge">${banglaPoints} পয়েন্ট</span>
          </div>
        `;
      }).join('');
    }

    function selectEssay(id) {
      loadEssay(id);
      closeMobileSidebar();
    }

    // Mobile Navigation Controls
    const menuToggle = document.getElementById('menu-toggle');
    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('overlay');

    function toggleSidebar() {
      sidebar.classList.toggle('active');
      overlay.classList.toggle('active');
    }

    function closeMobileSidebar() {
      if (window.innerWidth <= 768) {
        sidebar.classList.remove('active');
        overlay.classList.remove('active');
      }
    }

    menuToggle.addEventListener('click', toggleSidebar);
    overlay.addEventListener('click', toggleSidebar);

    // Dark Mode Toggle
    document.getElementById('theme-btn').addEventListener('click', () => {
      document.body.classList.toggle('dark-mode');
    });

    // Copy Content Button
    document.getElementById('copy-btn').addEventListener('click', () => {
      const text = document.querySelector('.essay-card').innerText;
      navigator.clipboard.writeText(text).then(() => {
        alert('লেখা কপি হয়েছে!');
      });
    });

    // Print Button
    document.getElementById('print-btn').addEventListener('click', () => {
      window.print();
    });

    // Search Filtering
    document.getElementById('search-input').addEventListener('input', (e) => {
      renderSidebar(e.target.value);
    });

    // Initialize Page
    document.addEventListener('DOMContentLoaded', () => {
      loadEssay(1);
    });
  </script>
</body>
</html>
